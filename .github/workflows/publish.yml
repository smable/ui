name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@smable'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Auth uses the built-in GITHUB_TOKEN (packages: write permission
      # above) — it rotates automatically, unlike a PAT stored in a repo
      # secret, which is how every publish run before v0.9.0 rotted to 401.
      # Works because package.json `repository` links this repo, so the
      # package accepts the repo-scoped token.
      #
      # Releases are sometimes published locally before the tag push lands
      # (registry token works while git push may lag on permissions). A
      # duplicate `npm publish` would fail the whole run — check first.
      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@smable/ui@$VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@smable/ui@$VERSION is already in the registry — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
